# Bei jedem Hochladen auf main: testen, bauen, auf GitHub Pages veröffentlichen.
# Schlagen die Tests fehl, wird nichts veröffentlicht.
name: Testen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Fertiges Paket von Playwright mit Test-Browsern und allen Systempaketen. Früher wurden die Pakete bei
    # jedem Lauf heruntergeladen; am 26.10.2026 dauerte das zweimal über 40 Minuten. Die Version muss zu
    # @playwright/test in package.json passen.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Ein normaler Lauf dauert wenige Minuten; ohne Grenze wartet GitHub bei einem Hänger 6 Stunden.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Handy-Durchläufe (iPhone = WebKit, Android = Chromium) vor jeder Veröffentlichung
      - run: npm run e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
